# CloudPanel vhost for aotd.eduardoalves.tech (Sites > aotd.eduardoalves.tech > Vhost).
#
# Static files (the Vite build in dist/) are served directly by Nginx.
# The Node.js app port ({{app_port}}) is used by the Web Push server (server/,
# pm2 process "aotd"), reachable under /api/push/.
#
# Cache-Control is set with "expires" instead of add_header, so the security
# headers declared at server level are inherited by every location.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name aotd.eduardoalves.tech;
  root /home/eduardoalves-aotd/htdocs/aotd.eduardoalves.tech/dist;

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # Never serve hidden files (.env, .git) even if one ends up inside dist/.
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # Security headers for every response.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://graphql.anilist.co https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Web Push server (server/), running as the Node.js app of this site.
  location /api/push/ {
    proxy_pass http://127.0.0.1:{{app_port}};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10;
    proxy_read_timeout 30;
    client_max_body_size 16k;
    expires -1;
  }

  # Never cache the service worker and the manifest, so updates reach users quickly.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }

  # Hashed build assets never change, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # Icons, images and fonts in the site root.
  location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2?)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
  }

  # SPA fallback: unknown paths are served by index.html so React Router handles them.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
