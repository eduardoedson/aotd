# Paste these blocks inside the server block of aotd.net
# (CloudPanel: Sites > aotd.net > Vhost). Keep the existing SSL and logging lines.

# Never cache the service worker and the manifest, so updates reach users quickly.
location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    try_files $uri =404;
}

# Hashed build assets can be cached forever.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA fallback: every unknown path is served by index.html so React Router can handle it.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
